name: Laboratório Kubernetes
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Instalar k3d
        run: |
          curl -fsSLo /tmp/k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          sudo install -m 755 /tmp/k3d /usr/local/bin/k3d
      - run: bash k8s/up.sh
      - run: bash k8s/check.sh
      - run: bash k8s/check-scale.sh
      - name: Diagnóstico
        if: failure()
        run: kubectl --context k3d-zero-lab -n zero-lab get pods,events

name: Testes da API
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lab_ci
          POSTGRES_PASSWORD: ci_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lab_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: lab_ci
      NEON_DB_PASSWORD: ci_local
      RUN_PG_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v

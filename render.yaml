services:
  - type: web
    name: cloud-native-zero-lab
    runtime: docker
    dockerfilePath: ./deploy/render.Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NEON_DB_PASSWORD
        sync: false
      - key: LAB_ACCESS_PASSWORD
        generateValue: true
